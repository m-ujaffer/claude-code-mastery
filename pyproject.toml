[project]
name = "claude-code-mastery"
version = "1.0.0"
description = "A 6-week, hands-on course for mastering Claude Code, built around the TaskForge practice app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # TaskForge practice app
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    # Testing and tooling
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
]

# Larger packages only needed later in the course. They are not installed by a
# plain `uv sync` / `uv run`, so Day 1 setup stays small and fast.
# Install them with:  uv sync --all-groups   (post-create.sh does this for you)
[dependency-groups]
mcp = ["mcp>=2.0"]                # Week 4: MCP servers
sdk = ["claude-agent-sdk>=0.1"]   # Week 6: Claude Agent SDK (large wheel, bundles a CLI)

[project.scripts]
labcheck = "labcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labcheck", "practice-app/src/taskforge"]

[tool.hatch.build]
dev-mode-dirs = [".", "practice-app/src"]

[tool.pytest.ini_options]
testpaths = ["practice-app/tests"]
pythonpath = ["practice-app/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["checkpoints", "solutions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["taskforge", "labcheck"]

[tool.ruff.lint.per-file-ignores]
# The legacy module is intentionally ugly; Week 5 cleans it up.
"practice-app/src/taskforge/legacy/*" = ["E501", "E701", "E702", "E711", "I001", "UP"]
# FastAPI's Depends() in defaults is idiomatic.
"practice-app/src/taskforge/api/*" = ["B008"]
# labcheck prints long, friendly messages.
"labcheck/*" = ["E501"]
"scripts/*" = ["E501"]
